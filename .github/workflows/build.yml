name: Build and Publish Rulesets

on:
  schedule:
    - cron: '0 20 * * *' # 每日北京时间凌晨 04:00 自动触发
  workflow_dispatch:      # 支持手动一键测试触发

jobs:
  build:
    name: Auto Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          cache: false

      - name: Install System Utilities & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl
          go install -trimpath -ldflags="-s -w" github.com/metacubex/geo/cmd/geo@master
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          sudo cp tools/bin/rkt-rules-compiler /usr/local/bin/
          sudo chmod +x /usr/local/bin/rkt-rules-compiler

      - name: Download Upstream Rules Data
        run: |
          mkdir -p raw
          cd raw
          # 1. 编译原材料全量数据源 (直接对接 MaxMind/Loyalsoldier 一手源，带 3 次重试容错)
          curl -fsSL --retry 3 --retry-delay 2 -o Country.mmdb https://github.com/Dreamacro/maxmind-geoip/raw/release/Country.mmdb
          curl -fsSL --retry 3 --retry-delay 2 -o GeoLite2-ASN.mmdb https://raw.githubusercontent.com/xishang0128/geoip/release/GeoLite2-ASN.mmdb
          curl -fsSL --retry 3 --retry-delay 2 -o geoip.dat https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat
          curl -fsSL --retry 3 --retry-delay 2 -o geosite.dat https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat
          
          # 2. 软路由/低内存专用精简原材料 (Lite)
          curl -fsSL --retry 3 --retry-delay 2 -o geoip-lite.dat https://github.com/xishang0128/geoip/raw/release/geoip.dat

      - name: Compile to Native .rrs Rulesets
        run: |
          mkdir -p dist/geosite dist/geoip dist/asn
          # 批量解包编译各分类、国家与热门自治域
          rkt-rules-compiler convert site --input raw/geosite.dat --output-dir dist/geosite/
          rkt-rules-compiler convert ip --input raw/geoip.dat --output-dir dist/geoip/
          rkt-rules-compiler convert asn --input raw/GeoLite2-ASN.mmdb --output-dir dist/asn/ --hot-only

      - name: Compile Native .rdb Databases
        run: |
          mkdir -p publish
          # 1. 对齐 sing-box 标准纯净前缀树 (3.76MB, 65.7 万节点)
          go -C tools run build_geoip.go -input ../raw/Country.mmdb -output ../publish/geoip.rdb
          
          # 2. 软路由专用复合精简数据库 (380KB, 含 CN 核心国家与主流大厂标签)
          geo convert ip -i v2ray -o meta -f publish/geoip-lite.rdb raw/geoip-lite.dat

      - name: Archive Full & Lite Bundles
        run: |
          # 1. 全量 7z 总包 (高压缩比，包含所有 .rrs)
          cd dist && 7z a -mx=9 ../publish/BundleRRS.7z ./*/*.rrs && cd ..
          
          # 2. 嵌入式软路由专用精简核心总包 (BundleRRS-lite.7z, ~2.2MB)
          mkdir -p /tmp/lite_rrs
          cp dist/geosite/geosite-cn.rrs dist/geosite/geosite-openai.rrs dist/geosite/geosite-google.rrs dist/geosite/geosite-category-ads-all.rrs dist/geoip/geoip-cn.rrs dist/geoip/geoip-private.rrs /tmp/lite_rrs/ 2>/dev/null || true
          cd /tmp/lite_rrs && 7z a -mx=9 /tmp/BundleRRS-lite.7z ./*.rrs && cd -
          mv /tmp/BundleRRS-lite.7z publish/
          
          # 3. 生成校验和
          cd publish
          sha256sum BundleRRS.7z BundleRRS-lite.7z geoip.rdb geoip-lite.rdb > sha256sums.txt

      - name: Deploy to rrs branch (CDN layer)
        run: |
          cp README.md dist/
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b rrs
          git add -A
          git commit -m "Auto-compiled rulesets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rrs

      - name: Deploy to release branch (Asset layer)
        run: |
          cp README.md publish/
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release assets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-cn.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-category-ads-all.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-geolocation-!cn.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geoip/geoip-cn.rrs" || true
