name: Build and Publish Rulesets

on:
  schedule:
    - cron: '0 20 * * *' # 每日北京时间凌晨 04:00 自动触发
  workflow_dispatch:      # 支持手动一键触发

jobs:
  build:
    name: Auto Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4

      - name: Setup Rust & Dependencies
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl

      - name: Build rkt-rules-compiler
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/rkt.git /tmp/rkt
          cargo build --release --manifest-path /tmp/rkt/Cargo.toml -p rkt-rules --bin rkt-rules-compiler
          cp /tmp/rkt/target/release/rkt-rules-compiler /usr/local/bin/

      - name: Download Upstream Rules Data
        run: |
          mkdir -p raw && cd raw
          # 1. 权威全量数据源 (带 3 次重试容错)
          curl -fsSL --retry 3 --retry-delay 2 -o GeoLite2-ASN.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          curl -fsSL --retry 3 --retry-delay 2 -o Country.mmdb https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
          curl -fsSL --retry 3 --retry-delay 2 -o geoip.dat https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat
          curl -fsSL --retry 3 --retry-delay 2 -o geosite.dat https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat
          curl -fsSL --retry 3 --retry-delay 2 -o geoip.metadb https://github.com/MetaCubeX/meta-rules-dat/raw/release/geoip.metadb
          
          # 2. 软路由/低内存专用精简数据 (Lite)
          curl -fsSL --retry 3 --retry-delay 2 -o Country-lite.mmdb https://raw.githubusercontent.com/xishang0128/geoip/release/Country.mmdb
          curl -fsSL --retry 3 --retry-delay 2 -o geoip-lite.dat https://github.com/xishang0128/geoip/raw/release/geoip.dat
          curl -fsSL --retry 3 --retry-delay 2 -o geoip-lite.metadb https://github.com/MetaCubeX/meta-rules-dat/raw/release/geoip-lite.metadb

      - name: Compile to Native .rrs Rulesets
        run: |
          mkdir -p dist/geosite dist/geoip dist/asn
          # 批量解包编译各分类、国家与热门自治域
          rkt-rules-compiler convert site --input raw/geosite.dat --output-dir dist/geosite/
          rkt-rules-compiler convert ip --input raw/geoip.dat --output-dir dist/geoip/
          rkt-rules-compiler convert asn --input raw/GeoLite2-ASN.mmdb --output-dir dist/asn/ --hot-only

      - name: Archive Full & Lite Bundles
        run: |
          mkdir -p publish
          # 1. 全量 7z 总包 (高压缩比，包含所有 .rrs)
          cd dist && 7z a -mx=9 ../publish/BundleRRS.7z ./*/*.rrs && cd ..
          
          # 2. 嵌入式软路由专用精简核心总包 (BundleRRS-lite.7z, ~300KB)
          mkdir -p /tmp/lite_rrs
          cp dist/geosite/geosite-cn.rrs dist/geosite/geosite-openai.rrs dist/geosite/geosite-google.rrs dist/geosite/geosite-category-ads-all.rrs dist/geoip/geoip-cn.rrs dist/geoip/geoip-private.rrs /tmp/lite_rrs/ 2>/dev/null || true
          cd /tmp/lite_rrs && 7z a -mx=9 /tmp/BundleRRS-lite.7z ./*.rrs && cd -
          mv /tmp/BundleRRS-lite.7z publish/
          
          # 3. 归档单体大数据库与复合库 (Full & Lite)
          cp raw/Country.mmdb publish/country.mmdb
          cp raw/Country-lite.mmdb publish/country-lite.mmdb
          cp raw/GeoLite2-ASN.mmdb publish/GeoLite2-ASN.mmdb
          cp raw/geoip.dat publish/geoip.dat
          cp raw/geoip-lite.dat publish/geoip-lite.dat
          cp raw/geosite.dat publish/geosite.dat
          cp raw/geoip.metadb publish/geoip.rdb
          cp raw/geoip-lite.metadb publish/geoip-lite.rdb
          
          # 4. 生成校验和
          cd publish && sha256sum * > sha256sums.txt

      - name: Deploy to rrs branch (CDN layer)
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b rrs
          git add .
          git commit -m "Auto-compiled rulesets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" rrs

      - name: Deploy to release branch (Asset layer)
        run: |
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -b release
          git add .
          git commit -m "Release assets: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" release

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-cn.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-category-ads-all.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geosite/geosite-geolocation-!cn.rrs" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@rrs/geoip/geoip-cn.rrs" || true
